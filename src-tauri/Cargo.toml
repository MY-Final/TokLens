[package]
name = "toklens"
version = "0.1.12"
description = "TokLens desktop application"
authors = ["TokLens"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toklens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13.3", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
# 面板 AI 生成（OpenAI 兼容）：Rust 代发、仅用户显式触发时出网。
# 复用 tauri-plugin-updater 已引入的 rustls/ring（`rustls-no-provider` 不新增 TLS 提供方）。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# API Key 仅存 OS 凭据库（write-only）；平台原生后端，无系统库依赖。
keyring = { version = "3.6", default-features = false, features = [
    "windows-native",
    "apple-native",
    "linux-native",
] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
